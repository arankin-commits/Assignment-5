<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="javascript.js" defer></script>
</head>
<body>

    <h1>Website Icon Mouse Events</h1>

    <span id="icon-container">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
             data-name="YouTube"
             data-url="https://www.youtube.com"
             alt="YouTube">
    
        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=roblox.com&sz=128"
             data-name="Roblox"
             data-url="https://www.roblox.com"
             alt="Roblox">
    
        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=coolmathgames.com&sz=128"
             data-name="Coolmath Games"
             data-url="https://www.coolmathgames.com"
             alt="Coolmath Games">
    
        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=myanimelist.net&sz=128"
             data-name="MyAnimeList"
             data-url="https://myanimelist.net"
             alt="MyAnimeList">
    
        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=reddit.com&sz=128"
             data-name="Reddit"
             data-url="https://www.reddit.com"
             alt="Reddit">
    
        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=playqueensgame.com&sz=128"
             data-name="Play Queens Game"
             data-url="https://playqueensgame.com"
             alt="Play Queens Game">
    
    </span>

    <p id="in">In: </p>
    <p id="out">Out: </p>
    <p id="coordinates">Mouse X: , Y: </p>

    <img id="enlarged-icon" src="" alt="Enlarged icon">

</body>
</html>
