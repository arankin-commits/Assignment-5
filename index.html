<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>

    <link rel="stylesheet" href="style.css">

    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="javascript.js" defer></script>
</head>
<body>

    <h1>Website Icon Mouse Events</h1>

    <p id="in">In: </p>
    <p id="out">Out: </p>
    <p id="coordinates">Mouse X: , Y: </p>

    <span id="icon-container">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=google.com&sz=128"
             data-name="Google"
             data-url="https://www.google.com"
             alt="Google">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
             data-name="YouTube"
             data-url="https://www.youtube.com"
             alt="YouTube">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=facebook.com&sz=128"
             data-name="Facebook"
             data-url="https://www.facebook.com"
             alt="Facebook">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128"
             data-name="Instagram"
             data-url="https://www.instagram.com"
             alt="Instagram">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=reddit.com&sz=128"
             data-name="Reddit"
             data-url="https://www.reddit.com"
             alt="Reddit">

        <img class="website-icon"
             src="https://www.google.com/s2/favicons?domain=github.com&sz=128"
             data-name="GitHub"
             data-url="https://www.github.com"
             alt="GitHub">

    </span>

    <!-- Enlarged icon appears here when clicked -->
    <img id="enlarged-icon" src="" alt="Enlarged icon">

</body>
</html>
